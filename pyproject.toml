[project]
name = "ste-dial"
version = "0.1.0"
description = "Measures how asking a coding agent for X% ASD-STE100 Simplified Technical English changes its explanations of an unfamiliar codebase."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
ste-run = "ste_dial.run:main"
ste-analyze = "ste_dial.analyze.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ste_dial"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_functions = ["should_*", "test_*"]
